# basic usage: 2 stops, 3 departures each
type: custom:vienna-transport-card-v2
max_departures: 3
entities:
  - entity: sensor.wl_monitor_4620
    type: subway
  - entity: sensor.wl_monitor_4918
    type: subway


# compact mode: combines same line+direction into one row, showing all countdowns
type: custom:vienna-transport-card-v2
max_departures: 5
compact_mode: true
entities:
  - entity: sensor.wl_monitor_4620
    type: subway


# hide direction text for a narrower card column
type: custom:vienna-transport-card-v2
max_departures: 3
show_direction: false
entities:
  - entity: sensor.wl_monitor_4620
    type: subway


# compact mode + hidden direction for maximum space savings
type: custom:vienna-transport-card-v2
max_departures: 5
compact_mode: true
show_direction: false
entities:
  - entity: sensor.wl_monitor_4620
    type: subway


# group by station: one card per station name, showing all lines/directions
type: custom:vienna-transport-card-v2
max_departures: 2
compact_mode: true
group_by_station: true
line_colors:
  - U6: "#a4642c"
  - 64A: "#1c60a7"
entities:
  - entity: sensor.wl_monitor_4632
    type: subway
  - entity: sensor.wl_monitor_4637
    type: subway
  - entity: sensor.wl_monitor_1866
    type: bus
  - entity: sensor.wl_monitor_1854
    type: bus


# filter by direction
type: custom:vienna-transport-card-v2
max_departures: 3
entities:
  - entity: sensor.wl_monitor_1212
    type: bim
    direction: Grinzing


# filter by line
type: custom:vienna-transport-card-v2
max_departures: 3
entities:
  - entity: sensor.wl_monitor_1212
    type: bim
    lines:
      - "38"
      - "41"
